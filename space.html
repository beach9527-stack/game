<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>麻将消除试玩版</title>
    <style>
      :root {
        --bg: linear-gradient(180deg, #2f9be8 0%, #63bdf0 34%, #a5e3f7 55%, #cdeeda 68%, #f3e2ae 84%, #eed9a0 100%);
        --ink: #173a2a;
        --chip: rgba(255, 255, 255, 0.55);
        --chip-ink: #0d4d2e;
        --panel: #fffdf4;
        --panel-ink: #263238;
        --accent: #e8862e;
        --accent-ink: #7a3d00;
        --green: #1e9e57;
        --green-deep: #14703c;
        --wood: #8a5a24;
        --wood-dark: #6e4415;
        --tray-bg: linear-gradient(180deg, #a06a28, #7d5016);
        --slot-bg: #5d3a0e;
        --btn: linear-gradient(180deg, #a5672a, #7d5016);
        --btn-ink: #ffe9bd;
        --danger: #d64541;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: linear-gradient(180deg, #0a2748 0%, #0f3a5f 34%, #155263 55%, #1d5c4c 68%, #6d5c33 84%, #584a28 100%);
          --ink: #e8f4ec;
          --chip: rgba(10, 30, 50, 0.55);
          --chip-ink: #cfeeda;
          --panel: #1d2b33;
          --panel-ink: #eef4f0;
          --btn-ink: #ffe9bd;
        }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        overflow: hidden;
      }
      .scene {
        position: fixed; inset: 0; background: var(--bg); z-index: -2;
      }
      .sun {
        position: fixed; top: -46px; right: -30px; width: 170px; height: 170px;
        border-radius: 50%; background: radial-gradient(circle, rgba(255,244,190,.95) 0%, rgba(255,226,130,.55) 45%, rgba(255,226,130,0) 72%);
        z-index: -1; pointer-events: none;
      }
      .leaf-deco { position: fixed; z-index: -1; opacity: .5; pointer-events: none; }
      .leaf-deco.left { top: -14px; left: -20px; transform: rotate(16deg); }
      .leaf-deco.right { bottom: 64px; right: -26px; transform: rotate(200deg); opacity: .35; }

      #app { height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }

      /* ---------- header ---------- */
      header.game-head {
        display: flex; align-items: center; gap: 8px; padding: 10px 2px 6px;
      }
      .icon-btn {
        width: 42px; height: 42px; border: none; border-radius: 12px; cursor: pointer;
        background: linear-gradient(180deg, #ffd968, #f5a623);
        box-shadow: 0 3px 0 #c47f12, 0 5px 10px rgba(0,0,0,.25);
        display: grid; place-items: center; flex: none;
      }
      .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c47f12; }
      .icon-btn svg { width: 20px; height: 20px; fill: #8a4d00; }
      .icon-btn.small { width: 36px; height: 36px; border-radius: 10px; }
      .icon-btn.small svg { width: 17px; height: 17px; }
      .level-label { font-weight: 800; font-size: 19px; color: #fff; text-shadow: 0 2px 0 rgba(20,80,40,.45), 0 1px 6px rgba(0,0,0,.3); white-space: nowrap; }
      @media (prefers-color-scheme: dark) { .level-label { color: #ffe9a8; } }
      .score-chip {
        margin-left: auto; background: var(--chip); border-radius: 999px; padding: 6px 14px;
        font-weight: 800; font-size: 17px; color: var(--accent-ink); white-space: nowrap;
        backdrop-filter: blur(3px);
      }
      @media (prefers-color-scheme: dark) { .score-chip { color: #ffcf7d; } }
      .score-chip b { color: var(--accent); font-size: 19px; }
      @media (prefers-color-scheme: dark) { .score-chip b { color: #ffb84d; } }
      .mini-chip {
        background: var(--chip); color: var(--chip-ink); border-radius: 999px; padding: 6px 10px;
        font-size: 13px; font-weight: 700; white-space: nowrap; backdrop-filter: blur(3px);
      }

      .statusline { display: flex; justify-content: space-between; padding: 0 2px 4px; }

      /* ---------- tray ---------- */
      .tray-wrap { display: flex; justify-content: center; padding: 2px 0 4px; }
      .tray {
        background: var(--tray-bg); border-radius: 16px; padding: 9px 10px;
        display: flex; gap: 6px;
        box-shadow: inset 0 2px 0 rgba(255,220,160,.5), inset 0 -3px 0 rgba(0,0,0,.28), 0 6px 14px rgba(30,40,20,.35);
      }
      .slot {
        width: clamp(38px, 11.5vw, 52px); aspect-ratio: 0.8;
        background: var(--slot-bg); border-radius: 9px;
        box-shadow: inset 0 3px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,220,160,.25);
        display: grid; place-items: center; position: relative;
      }
      .slot .tile { position: relative; width: 100%; height: 100%; }

      /* ---------- board ---------- */
      #boardWrap { flex: 1; display: grid; place-items: center; min-height: 0; padding: 4px 0; }
      #board { position: relative; }

      .tile {
        position: absolute; border: none; padding: 0; cursor: pointer;
        background: linear-gradient(180deg, #fffef9 0%, #fdf6e3 78%, #f3e9cd 100%);
        border-radius: 11% / 9%;
        box-shadow:
          inset 0 0 0 2px rgba(120, 90, 20, 0.12),
          inset 0 -0.32em 0 #22a35c,
          inset 0 -0.42em 0 #157347,
          0.14em 0.22em 0.35em rgba(15, 40, 25, 0.35);
        container-type: size;
        transition: filter .15s ease, transform .15s ease, opacity .18s ease;
        font-family: "Noto Serif SC", "STKaiti", "KaiTi", "Songti SC", serif;
        user-select: none; -webkit-user-select: none; touch-action: manipulation;
      }
      .tile .face { position: absolute; inset: 1% 0 25%; display: grid; place-items: center; pointer-events: none; }
      .tile.blocked { filter: brightness(0.66) saturate(0.72); cursor: default; }
      .tile.free:hover, .tile.free:active { transform: translateY(-3px) scale(1.04); filter: brightness(1.05); z-index: 999 !important; }
      .tile.fly { transform: translateY(-14px) scale(1.12); opacity: 0; }
      .tile.selected {
        transform: translateY(-3px) scale(1.05); z-index: 998 !important;
        box-shadow: inset 0 0 0 3px #ffb020, inset 0 -0.32em 0 #22a35c, inset 0 -0.42em 0 #157347, 0 0 16px 4px rgba(255, 176, 32, 0.8);
      }
      .tile.shake { animation: shake .28s ease; }
      @keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -3px; } 75% { margin-left: 3px; } }
      .tile.hinted { animation: hintpulse .55s ease-in-out infinite alternate; }
      @keyframes hintpulse {
        from { box-shadow: inset 0 0 0 2px rgba(120,90,20,.12), inset 0 -.32em 0 #22a35c, inset 0 -.42em 0 #157347, 0 0 0 0 rgba(255,190,40,0); }
        to   { box-shadow: inset 0 0 0 3px #ffb020, inset 0 -.32em 0 #22a35c, inset 0 -.42em 0 #157347, 0 0 18px 4px rgba(255,190,40,.75); }
      }
      .tile.pop { animation: pop .22s ease; }
      @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
      .tile.clearing { animation: clearout .3s ease forwards; }
      @keyframes clearout { 40% { transform: scale(1.18); filter: brightness(1.3); } 100% { transform: scale(.2); opacity: 0; } }
      .tile.flip { animation: flip .45s ease; }
      @keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        .tile, .tile.hinted, .tile.pop, .tile.flip, .tile.shake { animation: none !important; transition: none !important; }
      }

      /* face glyphs */
      .wan { display: flex; flex-direction: column; align-items: center; line-height: 1.02; }
      .wan .n { font-size: 13vw; font-size: 39cqw; font-weight: 900; color: #232323; }
      .wan .w { font-size: 12vw; font-size: 35cqw; font-weight: 900; color: #c0272d; }
      .big-char { font-size: 16vw; font-size: 52cqw; font-weight: 900; line-height: 1; }
      .bai-box { width: 52cqw; height: 52cqw; border: 4px solid #20549e; border-radius: 8px; box-shadow: inset 0 0 0 2px #fdf6e3, inset 0 0 0 4px #20549e; }
      .dot { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; border: 2.5px solid var(--c); background: radial-gradient(circle, var(--c) 0 24%, rgba(255,255,255,0) 26%); }
      .dot.big { width: 54%; aspect-ratio: 1; border-width: 4px; background: radial-gradient(circle, var(--c) 0 16%, rgba(255,255,255,0) 17%, rgba(255,255,255,0) 38%, var(--c) 39%, var(--c) 44%, rgba(255,255,255,0) 45%); }
      .dot.sm { width: 23%; aspect-ratio: 1; }
      .stick { position: absolute; transform: translate(-50%, -50%); width: 12.5%; height: 20%; border-radius: 5px;
        background: linear-gradient(90deg, #0b7439, #29bb68 45%, #0b7439); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
      .stick::after { content: ""; position: absolute; left: 10%; right: 10%; top: 45%; height: 9%; background: rgba(255,255,255,.6); border-radius: 2px; }
      .stick.r { background: linear-gradient(90deg, #a01d24, #d8404a 45%, #a01d24); }
      .stick.b { background: linear-gradient(90deg, #17548f, #2f7fc4 45%, #17548f); }
      .stick.big { width: 20%; height: 46%; border-radius: 8px; }

      /* ---------- toolbar ---------- */
      .toolbar { display: flex; justify-content: center; gap: clamp(14px, 6vw, 34px); padding: 10px 0 14px; }
      .tool {
        position: relative; border: none; cursor: pointer; width: 76px; padding: 10px 0 7px;
        background: var(--btn); border-radius: 14px; color: var(--btn-ink);
        box-shadow: inset 0 2px 0 rgba(255,220,160,.45), inset 0 -3px 0 rgba(0,0,0,.3), 0 5px 12px rgba(30,40,20,.35);
        font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .tool:active { transform: translateY(2px); }
      .tool svg { width: 27px; height: 27px; fill: #ffd968; }
      .tool span { font-size: 15px; font-weight: 800; letter-spacing: .12em; }
      .tool .badge {
        position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; padding: 0 5px;
        background: var(--danger); color: #fff; border-radius: 999px; font-size: 13px; font-weight: 800;
        display: grid; place-items: center; box-shadow: 0 2px 5px rgba(0,0,0,.3);
      }
      .tool:disabled { filter: grayscale(.7) brightness(.8); cursor: default; }
      .tool:disabled:active { transform: none; }

      /* ---------- screens & overlays ---------- */
      .screen { height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px); overflow-y: auto; }
      .home-title { text-align: center; margin: 8px 0 2px; font-family: "Noto Serif SC", "STKaiti", "KaiTi", serif; font-size: 46px; font-weight: 900; letter-spacing: .08em; color: #fff; text-shadow: 0 3px 0 rgba(20,90,45,.5), 0 6px 18px rgba(0,0,0,.3); }
      @media (prefers-color-scheme: dark) { .home-title { color: #ffe9a8; } }
      .home-sub { text-align: center; margin: 0 0 20px; font-size: 15px; color: #eafcff; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
      .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .level-card {
        border: none; cursor: pointer; text-align: left; border-radius: 16px; padding: 14px 16px;
        background: var(--panel); color: var(--panel-ink);
        box-shadow: 0 6px 16px rgba(15,50,30,.3), inset 0 -4px 0 rgba(20,120,60,.35);
        font-family: inherit;
      }
      .level-card:active { transform: translateY(2px); }
      .level-card .lv { font-size: 13px; font-weight: 700; color: var(--green-deep); letter-spacing: .1em; }
      @media (prefers-color-scheme: dark) { .level-card .lv { color: #7ed491; } }
      .level-card .nm { font-size: 21px; font-weight: 900; margin: 2px 0 4px; font-family: "Noto Serif SC", "STKaiti", serif; }
      .level-card .meta { font-size: 12.5px; opacity: .75; }
      .level-card .best { font-size: 12.5px; color: var(--accent); font-weight: 700; margin-top: 4px; min-height: 16px; }
      .howto { margin-top: 20px; background: var(--chip); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.75; color: var(--chip-ink); backdrop-filter: blur(3px); }
      .howto b { font-weight: 800; }

      .overlay {
        position: fixed; inset: 0; background: rgba(8, 25, 18, 0.55);
        display: none; place-items: center; z-index: 1000; padding: 20px;
      }
      .overlay.open { display: grid; }
      .dialog {
        background: var(--panel); color: var(--panel-ink); border-radius: 20px; padding: 26px 24px 22px;
        width: min(92vw, 380px); text-align: center;
        box-shadow: 0 18px 44px rgba(0,0,0,.4), inset 0 -5px 0 rgba(20,120,60,.3);
      }
      .dialog h2 { margin: 0 0 6px; font-size: 30px; font-family: "Noto Serif SC", "STKaiti", serif; font-weight: 900; }
      .dialog p { margin: 4px 0; font-size: 15px; line-height: 1.6; opacity: .88; }
      .stars { font-size: 38px; letter-spacing: .15em; color: #f5a623; margin: 6px 0 2px; }
      .stars .off { color: #cfd4cd; }
      .stat-row { display: flex; justify-content: center; gap: 22px; margin: 10px 0 4px; font-size: 14px; }
      .stat-row b { font-size: 19px; display: block; }
      .dialog .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
      .big-btn {
        border: none; cursor: pointer; border-radius: 13px; padding: 13px; font-size: 17px; font-weight: 800;
        font-family: inherit; background: linear-gradient(180deg, #2fbf71, #1e9e57); color: #fff;
        box-shadow: 0 4px 0 #14703c, 0 7px 14px rgba(20,90,45,.35);
      }
      .big-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #14703c; }
      .big-btn.ghost { background: rgba(120,130,120,.14); color: var(--panel-ink); box-shadow: none; }
      .big-btn.warn { background: linear-gradient(180deg, #ffb84d, #f08c1a); box-shadow: 0 4px 0 #b96a08, 0 7px 14px rgba(150,90,10,.3); color: #5d3500; }

      #toast {
        position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%) translateY(16px);
        background: rgba(15, 35, 25, 0.88); color: #eafff2; padding: 9px 18px; border-radius: 999px;
        font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 1200; white-space: nowrap;
      }
      #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="scene"></div>
    <div class="sun"></div>
    <svg class="leaf-deco left" width="130" height="130" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4C78 22 92 48 88 78 60 92 30 84 12 58 26 30 34 16 50 4Z" fill="#2e8b47"/><path d="M50 10C48 34 44 58 34 84" stroke="#1d5c2e" stroke-width="3" fill="none"/></svg>
    <svg class="leaf-deco right" width="120" height="120" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4C78 22 92 48 88 78 60 92 30 84 12 58 26 30 34 16 50 4Z" fill="#2e8b47"/><path d="M50 10C48 34 44 58 34 84" stroke="#1d5c2e" stroke-width="3" fill="none"/></svg>

    <!-- ======= home / level select ======= -->
    <section id="homeScreen" class="screen">
      <h1 class="home-title">麻将消除</h1>
      <p class="home-sub">试玩版 · 共 5 关 · 同层两张相同，点中直接消</p>
      <div class="level-grid" id="levelGrid"></div>
      <div class="howto">
        <b>玩法：</b>牌一层层叠放。点一张<b>亮着的牌</b>选中它（被压住、或左右两侧都被堵死的牌是暗的，点不动），
        再点另一张亮着的牌——两张<b>图案相同、并且在同一层</b>，就会一起消除；不在同一层，图案再像也消不掉。
        把牌全部消完过关；要是找不到能配对的牌了，可以用下方的 <b>洗牌 / 提示 / 撤回</b>，每关各 3 次。
      </div>
    </section>

    <!-- ======= game ======= -->
    <div id="app" class="hidden">
      <header class="game-head">
        <button class="icon-btn" id="pauseBtn" aria-label="暂停">
          <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>
        </button>
        <div class="level-label" id="levelLabel">第 1 关</div>
        <div class="score-chip">脑力：<b id="scoreVal">0</b></div>
        <button class="icon-btn small" id="soundBtn" aria-label="声音开关">
          <svg viewBox="0 0 24 24" id="soundOnIcon"><path d="M4 9v6h4l6 5V4L8 9H4z"/><path d="M17 8.5c1.2 1 1.2 6 0 7M19.5 6c2 1.8 2 10.2 0 12" stroke="#8a4d00" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" id="soundOffIcon" style="display:none"><path d="M4 9v6h4l6 5V4L8 9H4z"/><path d="M17 9l6 6M23 9l-6 6" stroke="#8a4d00" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
      </header>

      <div class="statusline">
        <span class="mini-chip" id="leftChip">剩 0 张</span>
        <span class="mini-chip">用时 <span id="timeChip">00:00</span></span>
      </div>

      <div id="boardWrap"><div id="board"></div></div>

      <nav class="toolbar">
        <button class="tool" id="shuffleBtn">
          <svg viewBox="0 0 24 24"><path d="M3 7h4.2c2.6 0 3.9 1 5.4 2.6L15.8 13h5.2M21 7h-5.2l-2 2.1M3 17h4.2c1.1 0 2-.2 2.8-.6M13.6 14.4L15.8 17H21" stroke="#ffd968" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.6 4.6 21.4 7l-2.8 2.4M18.6 14.6l2.8 2.4-2.8 2.4" fill="#ffd968"/></svg>
          <span>洗牌</span><span class="badge" id="shuffleBadge">3</span>
        </button>
        <button class="tool" id="hintBtn">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/><path d="M13 7.2 10.6 12H13l-1 3.4L14.6 11H12z" fill="#7d5016"/><rect x="9.6" y="18.4" width="4.8" height="1.8" rx=".9"/><rect x="10.2" y="20.8" width="3.6" height="1.6" rx=".8"/></svg>
          <span>提示</span><span class="badge" id="hintBadge">3</span>
        </button>
        <button class="tool" id="undoBtn">
          <svg viewBox="0 0 24 24"><path d="M9.5 5 4 10.5 9.5 16v-3.6c5.8 0 9 1.8 11 5.1-.4-6.4-3.4-10.7-11-11.2z"/></svg>
          <span>撤回</span><span class="badge" id="undoBadge">3</span>
        </button>
      </nav>
    </div>

    <!-- ======= overlays ======= -->
    <div class="overlay" id="pauseOverlay">
      <div class="dialog">
        <h2>暂停</h2>
        <p id="pauseInfo">休息一下，牌不会跑。</p>
        <div class="btns">
          <button class="big-btn" id="resumeBtn">继续游戏</button>
          <button class="big-btn ghost" id="restartBtn">重新开始本关</button>
          <button class="big-btn ghost" id="quitBtn">返回选关</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="winOverlay">
      <div class="dialog">
        <h2>过关啦！</h2>
        <div class="stars" id="winStars">★★★</div>
        <div class="stat-row">
          <div>脑力<b id="winScore">0</b></div>
          <div>用时<b id="winTime">00:00</b></div>
          <div>步数<b id="winMoves">0</b></div>
        </div>
        <div class="btns">
          <button class="big-btn" id="nextBtn">下一关</button>
          <button class="big-btn ghost" id="replayBtn">再玩一次本关</button>
          <button class="big-btn ghost" id="winHomeBtn">返回选关</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="loseOverlay">
      <div class="dialog">
        <h2>没有能消的牌了</h2>
        <p>剩下的牌里，找不到同层相同的对子了。<br />洗牌重新排布，或者撤回一步换个打法。</p>
        <div class="btns">
          <button class="big-btn warn" id="stuckShuffleBtn">洗牌，继续</button>
          <button class="big-btn ghost" id="stuckUndoBtn">撤回一步</button>
          <button class="big-btn" id="retryBtn">重新开始本关</button>
          <button class="big-btn ghost" id="loseHomeBtn">返回选关</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>

    <script>
      "use strict";
      const $ = (s) => document.querySelector(s);

      /* ================= faces ================= */
      const CN = ["一", "二", "三", "四", "五", "六", "七", "八", "九"];
      const FLOWERS = [["梅", "#8e44ad"], ["蘭", "#20549e"], ["菊", "#d9822b"], ["竹", "#1e9e57"]];
      const SEASONS = [["春", "#1e9e57"], ["夏", "#c0272d"], ["秋", "#b97a16"], ["冬", "#20549e"]];
      // pattern points [x%, y%] for 2..9 (1 is special)
      const PAT = {
        2: [[32, 27], [68, 73]],
        3: [[26, 21], [50, 50], [74, 79]],
        4: [[31, 27], [69, 27], [31, 73], [69, 73]],
        5: [[29, 24], [71, 24], [50, 50], [29, 76], [71, 76]],
        6: [[33, 19], [67, 19], [33, 50], [67, 50], [33, 81], [67, 81]],
        7: [[31, 14], [67, 36], [31, 36], [67, 60], [31, 60], [67, 84], [31, 84]],
        8: [[33, 13], [67, 13], [33, 38], [67, 38], [33, 63], [67, 63], [33, 88], [67, 88]],
        9: [[27, 17], [50, 17], [73, 17], [27, 50], [50, 50], [73, 50], [27, 83], [50, 83], [73, 83]],
      };
      const DOT_COLORS = ["#1d6fb8", "#c0392b", "#1e9e6a"];
      const RED_IDX = { 5: [2], 7: [0, 3], 9: [4] }; // bamboo sticks painted red

      function faceHTML(id) {
        const kind = id[0];
        if (kind === "w") {
          const n = +id.slice(1);
          return '<span class="wan"><span class="n">' + CN[n - 1] + '</span><span class="w">萬</span></span>';
        }
        if (kind === "d" || kind === "b") {
          const n = +id.slice(1);
          if (n === 1) {
            if (kind === "d") return '<span class="dot big" style="--c:#c0392b;left:50%;top:47%"></span>';
            return '<span class="stick big" style="left:50%;top:44%"></span><span class="stick r" style="left:34%;top:58%;width:10%;height:26%"></span><span class="stick b" style="left:66%;top:58%;width:10%;height:26%"></span>';
          }
          const pts = PAT[n];
          if (kind === "d") {
            return pts.map((p, i) => '<span class="dot sm" style="--c:' + DOT_COLORS[i % 3] + ";left:" + p[0] + "%;top:" + p[1] + '%"></span>').join("");
          }
          const reds = RED_IDX[n] || [];
          return pts.map((p, i) => '<span class="stick' + (reds.indexOf(i) >= 0 ? " r" : "") + '" style="left:' + p[0] + "%;top:" + p[1] + '%"></span>').join("");
        }
        if (kind === "f") {
          const ch = { E: "東", S: "南", W: "西", N: "北" }[id[1]];
          return '<span class="big-char" style="color:#232323">' + ch + "</span>";
        }
        if (id === "Z") return '<span class="big-char" style="color:#c0272d">中</span>';
        if (id === "Fa") return '<span class="big-char" style="color:#1466a0">發</span>';
        if (id === "Ba") return '<span class="bai-box"></span>';
        if (kind === "h") { const f = FLOWERS[+id[1] - 1]; return '<span class="big-char" style="color:' + f[1] + '">' + f[0] + "</span>"; }
        if (kind === "q") { const s = SEASONS[+id[1] - 1]; return '<span class="big-char" style="color:' + s[1] + '">' + s[0] + "</span>"; }
        return "";
      }
      function faceName(id) {
        const kind = id[0];
        if (kind === "w") return CN[+id.slice(1) - 1] + "萬";
        if (kind === "d") return id.slice(1) + "筒";
        if (kind === "b") return id.slice(1) + "条";
        if (kind === "f") return { E: "东风", S: "南风", W: "西风", N: "北风" }[id[1]];
        if (id === "Z") return "红中";
        if (id === "Fa") return "发财";
        if (id === "Ba") return "白板";
        if (kind === "h") return FLOWERS[+id[1] - 1][0];
        if (kind === "q") return SEASONS[+id[1] - 1][0];
        return id;
      }

      /* ================= levels ================= */
      function R(x0, y0, c, r) { const a = []; for (let j = 0; j < r; j++) for (let i = 0; i < c; i++) a.push([x0 + i * 2, y0 + j * 2]); return a; }
      function ROW(y, xs) { return xs.map((x) => [x, y]); }
      const LEVELS = [
        { name: "小试牛刀", par: 90, pool: ["w2", "w5", "w7", "d3", "d6", "b4", "fE", "Z"],
          layers: [R(0, 0, 4, 3), R(1, 1, 3, 2), ROW(2, [2, 4])] },
        { name: "渐入佳境", par: 150, pool: ["w1", "w4", "w8", "d2", "d5", "d9", "b3", "b7", "fS", "Fa"],
          layers: [R(0, 0, 5, 4), R(1, 2, 4, 2), R(2, 1, 4, 2)] },
        { name: "小有挑战", par: 220, pool: ["w3", "w6", "w9", "d1", "d4", "d8", "b2", "b5", "b9", "fW", "fN", "Z"],
          layers: [R(0, 0, 6, 4), R(1, 1, 5, 4), R(2, 2, 3, 2), ROW(3, [2, 4])] },
        { name: "步步为营", par: 300, pool: ["w1", "w5", "w9", "d3", "d6", "d9", "b1", "b4", "b8", "fE", "fS", "Z", "Fa", "h1"],
          layers: [R(0, 0, 6, 5), R(1, 1, 5, 4), R(2, 2, 4, 3), ROW(3, [3, 5])] },
        { name: "高手过招", par: 380, pool: ["w2", "w4", "w6", "w8", "d2", "d5", "d7", "b3", "b6", "b9", "fW", "fN", "Z", "Fa", "h3", "q1"],
          layers: [R(0, 0, 6, 6), R(1, 1, 5, 4), R(2, 2, 4, 3), ROW(3, [3, 5, 7, 9])] },
      ];

      /* ================= solvability (reverse generation) ================= */
      function overlaps(a, b) { return Math.abs(a.x - b.x) < 2 && Math.abs(a.y - b.y) < 2; }
      function isFreeIn(t, alive) {
        let left = false, right = false;
        for (const o of alive) {
          if (o === t) continue;
          if (o.z > t.z && overlaps(o, t)) return false; // covered
          if (o.z === t.z && Math.abs(o.y - t.y) < 2) {
            if (o.x === t.x - 2) left = true;
            if (o.x === t.x + 2) right = true;
          }
        }
        return !(left && right);
      }
      // Deal faces in same-layer pairs along a simulated removal:
      // repeatedly take two free tiles on the SAME layer, give them one face
      // from the bag, and remove them. Replaying those pairs in order always
      // solves the board, so a successful deal is guaranteed solvable.
      function dealPairs(tiles, bag) {
        for (let attempt = 0; attempt < 80; attempt++) {
          const alive = tiles.slice();
          const left = {};
          bag.forEach((f) => (left[f] = (left[f] || 0) + 1));
          const faces = {};
          let ok = true;
          while (alive.length) {
            const free = alive.filter((t) => isFreeIn(t, alive));
            const byZ = {};
            free.forEach((t) => { (byZ[t.z] = byZ[t.z] || []).push(t); });
            const zs = Object.keys(byZ).filter((z) => byZ[z].length >= 2);
            const avail = Object.keys(left).filter((f) => left[f] >= 2);
            if (!zs.length || !avail.length) { ok = false; break; }
            const group = byZ[zs[(Math.random() * zs.length) | 0]];
            let i1 = (Math.random() * group.length) | 0, i2 = (Math.random() * group.length) | 0;
            if (i2 === i1) i2 = (i2 + 1) % group.length;
            const f = avail[(Math.random() * avail.length) | 0];
            left[f] -= 2;
            faces[group[i1].id] = f; faces[group[i2].id] = f;
            alive.splice(alive.indexOf(group[i1]), 1);
            alive.splice(alive.indexOf(group[i2]), 1);
          }
          if (ok) { tiles.forEach((t) => (t.face = faces[t.id])); return true; }
        }
        return false;
      }
      function buildLevel(idx) {
        const L = LEVELS[idx];
        const tiles = [];
        L.layers.forEach((cells, z) => cells.forEach(([x, y]) => tiles.push({ x, y, z, face: null, alive: true })));
        tiles.forEach((t, i) => (t.id = i));
        for (let b = 0; b < 12; b++) {
          const bag = [];
          for (let i = 0; i < tiles.length / 2; i++) { const f = L.pool[(Math.random() * L.pool.length) | 0]; bag.push(f, f); }
          if (dealPairs(tiles, bag)) return tiles;
        }
        // vanishingly unlikely fallback: pair up neighbours layer by layer
        const byLayer = {};
        tiles.forEach((t) => { (byLayer[t.z] = byLayer[t.z] || []).push(t); });
        Object.keys(byLayer).forEach((z) => {
          const g = byLayer[z];
          for (let i = 0; i + 1 < g.length; i += 2) { const f = L.pool[(i / 2) % L.pool.length]; g[i].face = f; g[i + 1].face = f; }
        });
        return tiles;
      }

      /* ================= sound ================= */
      let audioCtx = null, soundOn = true;
      function tone(freq, dur, type, gain, when) {
        if (!soundOn) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === "suspended") audioCtx.resume();
          const t0 = audioCtx.currentTime + (when || 0);
          const o = audioCtx.createOscillator(), g = audioCtx.createGain();
          o.type = type || "sine"; o.frequency.value = freq;
          g.gain.setValueAtTime(gain || 0.08, t0);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(t0); o.stop(t0 + dur);
        } catch (e) { /* no audio */ }
      }
      const sfx = {
        click() { tone(660, 0.07, "triangle", 0.09); },
        blocked() { tone(150, 0.09, "square", 0.05); },
        match() { tone(880, 0.1, "sine", 0.1); tone(1318, 0.14, "sine", 0.1, 0.07); },
        win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, "triangle", 0.1, i * 0.1)); },
        lose() { [392, 330, 262].forEach((f, i) => tone(f, 0.18, "triangle", 0.09, i * 0.12)); },
        tool() { tone(520, 0.08, "sine", 0.08); tone(780, 0.1, "sine", 0.08, 0.06); },
      };

      /* ================= state ================= */
      const TILE_ASPECT = 1.28;
      let G = null; // game state
      const best = {}; // in-memory best score per level

      function fmtTime(s) { return String((s / 60) | 0).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

      function startGame(idx) {
        if (G && G.timer) clearInterval(G.timer);
        const tiles = buildLevel(idx);
        let maxX = 0, maxY = 0;
        tiles.forEach((t) => { maxX = Math.max(maxX, t.x); maxY = Math.max(maxY, t.y); });
        G = {
          idx, tiles, selected: null, score: 0, moves: 0,
          tools: { shuffle: 3, hint: 3, undo: 3 },
          history: [], seconds: 0, started: false, over: false, busy: false,
          W: maxX + 2, H: maxY + 2, timer: null,
        };
        $("#levelLabel").textContent = "第 " + (idx + 1) + " 关 · " + LEVELS[idx].name;
        $("#homeScreen").classList.add("hidden");
        $("#app").classList.remove("hidden");
        closeOverlays();
        renderBoard(); updateHUD(); layoutBoard();
        G.timer = setInterval(() => {
          if (G && G.started && !G.over && !anyOverlayOpen()) { G.seconds++; $("#timeChip").textContent = fmtTime(G.seconds); }
        }, 1000);
      }

      function aliveTiles() { return G.tiles.filter((t) => t.alive); }
      function freeSet() {
        const alive = aliveTiles();
        const set = new Set();
        alive.forEach((t) => { if (isFreeIn(t, alive)) set.add(t.id); });
        return set;
      }

      /* ================= rendering ================= */
      function layoutBoard() {
        if (!G) return;
        const wrap = $("#boardWrap");
        const availW = wrap.clientWidth - 4, availH = wrap.clientHeight - 4;
        const ux = Math.min(availW / G.W, availH / (G.H * TILE_ASPECT));
        const board = $("#board");
        board.style.width = ux * G.W + "px";
        board.style.height = ux * G.H * TILE_ASPECT + "px";
      }
      window.addEventListener("resize", layoutBoard);

      function renderBoard() {
        const board = $("#board");
        board.innerHTML = "";
        const free = freeSet();
        const sorted = aliveTiles().slice().sort((a, b) => a.z - b.z || a.y - b.y || a.x - b.x);
        sorted.forEach((t) => {
          const el = document.createElement("button");
          el.className = "tile" + (free.has(t.id) ? " free" : " blocked") + (G.selected === t.id ? " selected" : "");
          el.dataset.id = t.id;
          el.setAttribute("aria-label", faceName(t.face) + (free.has(t.id) ? "" : "（被压住）"));
          el.style.left = (t.x / G.W) * 100 + "%";
          el.style.top = (t.y / G.H) * 100 + "%";
          el.style.width = (2 / G.W) * 100 + "%";
          el.style.height = (2 / G.H) * 100 + "%";
          el.style.zIndex = t.z * 100 + t.y * 2 + t.x;
          el.style.fontSize = "14px";
          el.style.marginLeft = t.z * -1.5 + "px";
          el.style.marginTop = t.z * -2.5 + "px";
          el.innerHTML = '<span class="face">' + faceHTML(t.face) + "</span>";
          el.addEventListener("click", () => onTileClick(t.id, el));
          board.appendChild(el);
        });
      }

      function updateHUD() {
        $("#scoreVal").textContent = G.score;
        $("#leftChip").textContent = "剩 " + aliveTiles().length + " 张";
        $("#timeChip").textContent = fmtTime(G.seconds);
        setBadge("#shuffleBadge", G.tools.shuffle, "#shuffleBtn");
        setBadge("#hintBadge", G.tools.hint, "#hintBtn");
        setBadge("#undoBadge", G.tools.undo, "#undoBtn");
      }
      function setBadge(sel, n, btnSel) {
        $(sel).textContent = n;
        $(btnSel).disabled = n <= 0;
      }

      /* ================= gameplay ================= */
      function snapshot() {
        G.history.push(JSON.stringify({
          faces: G.tiles.map((t) => t.face),
          alive: G.tiles.map((t) => t.alive),
          score: G.score, moves: G.moves,
        }));
        if (G.history.length > 80) G.history.shift();
      }

      function onTileClick(id, el) {
        if (!G || G.over || G.busy) return;
        const t = G.tiles[id];
        if (!t.alive) return;
        if (!freeSet().has(id)) {
          el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
          sfx.blocked();
          return;
        }
        if (!G.started) G.started = true;
        if (G.selected === id) { G.selected = null; sfx.click(); renderBoard(); return; }
        if (G.selected === null) { G.selected = id; sfx.click(); renderBoard(); return; }
        const a = G.tiles[G.selected];
        if (a.face === t.face && a.z === t.z) {
          // same face AND same layer: the pair is eliminated together
          snapshot();
          G.busy = true;
          G.selected = null;
          sfx.match();
          const elA = document.querySelector('#board .tile[data-id="' + a.id + '"]');
          [elA, el].forEach((e) => { if (e) { e.classList.remove("selected"); e.classList.add("clearing"); } });
          setTimeout(() => {
            a.alive = false; t.alive = false;
            G.score += 20;
            G.moves++;
            renderBoard(); updateHUD();
            G.busy = false;
            checkEnd();
          }, 300);
        } else {
          if (a.face === t.face) toast("图案一样，但不在同一层，消不掉");
          G.selected = id;
          sfx.click();
          renderBoard();
        }
      }

      // any eliminable pair left? (two free tiles, same face, same layer)
      function hasMove() {
        const free = freeSet();
        const seen = {};
        for (const t of aliveTiles()) {
          if (!free.has(t.id)) continue;
          const k = t.face + "@" + t.z;
          if (seen[k]) return true;
          seen[k] = true;
        }
        return false;
      }

      function checkEnd() {
        if (aliveTiles().length === 0) {
          G.over = true;
          const timeBonus = Math.max(0, LEVELS[G.idx].par - G.seconds) * 2;
          G.score += timeBonus;
          updateHUD();
          if (!best[G.idx] || G.score > best[G.idx].score) best[G.idx] = { score: G.score, time: G.seconds };
          const stars = G.seconds <= LEVELS[G.idx].par ? 3 : G.seconds <= LEVELS[G.idx].par * 1.8 ? 2 : 1;
          $("#winStars").innerHTML = [1, 2, 3].map((i) => '<span class="' + (i <= stars ? "" : "off") + '">★</span>').join("");
          $("#winScore").textContent = G.score;
          $("#winTime").textContent = fmtTime(G.seconds);
          $("#winMoves").textContent = G.moves;
          $("#nextBtn").style.display = G.idx < LEVELS.length - 1 ? "" : "none";
          sfx.win();
          setTimeout(() => $("#winOverlay").classList.add("open"), 350);
          return;
        }
        if (!hasMove()) {
          G.over = true;
          sfx.lose();
          $("#stuckShuffleBtn").style.display = G.tools.shuffle > 0 ? "" : "none";
          $("#stuckUndoBtn").style.display = G.tools.undo > 0 && G.history.length ? "" : "none";
          setTimeout(() => $("#loseOverlay").classList.add("open"), 350);
        }
      }

      /* ================= tools ================= */
      function toast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 1600);
      }

      function doUndo(fromRescue) {
        if (!G || G.busy) return;
        if (G.tools.undo <= 0) { toast("撤回次数用完了"); return; }
        const snap = G.history.pop();
        if (!snap) { toast("没有可以撤回的步数"); return; }
        const s = JSON.parse(snap);
        G.tiles.forEach((t, i) => { t.face = s.faces[i]; t.alive = s.alive[i]; delete t.clearing; });
        G.selected = null;
        G.score = s.score; G.moves = s.moves;
        G.tools.undo--;
        G.over = false;
        closeOverlays();
        renderBoard(); updateHUD();
        sfx.tool();
        toast(fromRescue ? "已撤回一步，继续加油" : "已撤回一步");
      }

      function doShuffle() {
        if (!G || G.over || G.busy) return;
        if (G.tools.shuffle <= 0) { toast("洗牌次数用完了"); return; }
        const alive = aliveTiles();
        if (alive.length < 2) { toast("剩下的牌太少，不用洗了"); return; }
        // re-deal the same faces as same-layer pairs => still solvable
        const bag = alive.map((t) => t.face);
        if (!dealPairs(alive, bag)) { toast("洗牌失败，再试一次"); return; }
        G.tools.shuffle--;
        G.selected = null;
        G.history = []; // undo across a shuffle is not meaningful
        renderBoard(); updateHUD();
        document.querySelectorAll("#board .tile").forEach((el) => el.classList.add("flip"));
        sfx.tool();
        toast("已洗牌，牌局仍有解");
      }

      function doHint() {
        if (!G || G.over || G.busy) return;
        if (G.tools.hint <= 0) { toast("提示次数用完了"); return; }
        const free = freeSet();
        const groups = {};
        aliveTiles().forEach((t) => {
          if (!free.has(t.id)) return;
          const k = t.face + "@" + t.z;
          (groups[k] = groups[k] || []).push(t);
        });
        const pair = Object.keys(groups).map((k) => groups[k]).find((g) => g.length >= 2);
        if (!pair) { toast("现在没有能消的对子，试试洗牌"); return; }
        G.tools.hint--;
        updateHUD();
        pair.slice(0, 2).forEach((t) => {
          const el = document.querySelector('#board .tile[data-id="' + t.id + '"]');
          if (el) { el.classList.add("hinted"); setTimeout(() => el.classList.remove("hinted"), 1800); }
        });
        sfx.tool();
        toast("这两张「" + faceName(pair[0].face) + "」同层相同，可以消");
      }

      /* ================= overlays & navigation ================= */
      function anyOverlayOpen() { return document.querySelector(".overlay.open") !== null; }
      function closeOverlays() { document.querySelectorAll(".overlay").forEach((o) => o.classList.remove("open")); }
      function goHome() {
        if (G) { clearInterval(G.timer); G = null; }
        closeOverlays();
        $("#app").classList.add("hidden");
        $("#homeScreen").classList.remove("hidden");
        renderLevelGrid();
      }
      function renderLevelGrid() {
        const grid = $("#levelGrid");
        grid.innerHTML = "";
        LEVELS.forEach((L, i) => {
          const total = L.layers.reduce((s, a) => s + a.length, 0);
          const card = document.createElement("button");
          card.className = "level-card";
          card.innerHTML =
            '<div class="lv">第 ' + (i + 1) + ' 关</div>' +
            '<div class="nm">' + L.name + "</div>" +
            '<div class="meta">' + total + " 张牌 · " + L.layers.length + " 层</div>" +
            '<div class="best">' + (best[i] ? "最佳脑力 " + best[i].score + " · " + fmtTime(best[i].time) : "") + "</div>";
          card.addEventListener("click", () => { sfx.click(); startGame(i); });
          grid.appendChild(card);
        });
      }

      $("#pauseBtn").addEventListener("click", () => { if (G && !G.over) { $("#pauseInfo").textContent = "第 " + (G.idx + 1) + " 关 · 已用时 " + fmtTime(G.seconds) + " · 还剩 " + aliveTiles().length + " 张牌"; $("#pauseOverlay").classList.add("open"); } });
      $("#resumeBtn").addEventListener("click", closeOverlays);
      $("#restartBtn").addEventListener("click", () => startGame(G.idx));
      $("#quitBtn").addEventListener("click", goHome);
      $("#nextBtn").addEventListener("click", () => startGame(Math.min(G.idx + 1, LEVELS.length - 1)));
      $("#replayBtn").addEventListener("click", () => startGame(G.idx));
      $("#winHomeBtn").addEventListener("click", goHome);
      $("#retryBtn").addEventListener("click", () => startGame(G.idx));
      $("#loseHomeBtn").addEventListener("click", goHome);
      $("#stuckShuffleBtn").addEventListener("click", () => { closeOverlays(); if (G) { G.over = false; doShuffle(); } });
      $("#stuckUndoBtn").addEventListener("click", () => doUndo(true));
      $("#shuffleBtn").addEventListener("click", doShuffle);
      $("#hintBtn").addEventListener("click", doHint);
      $("#undoBtn").addEventListener("click", () => doUndo(false));
      $("#soundBtn").addEventListener("click", () => {
        soundOn = !soundOn;
        $("#soundOnIcon").style.display = soundOn ? "" : "none";
        $("#soundOffIcon").style.display = soundOn ? "none" : "";
        if (soundOn) sfx.click();
      });
      document.addEventListener("pointerdown", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }, { passive: true });

      renderLevelGrid();
    </script>
  </body>
</html>
